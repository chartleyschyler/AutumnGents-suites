<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password | Autumn Gents Suites</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; margin-bottom:18px;"><span class="brand-mark">A</span> Autumn Gents Suites</div>
    <h2>Reset Your Password</h2>
    <p class="subtitle">Enter your account email. We'll send a reset link if it exists.</p>
    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      <div class="success-msg" id="msg"></div>
    </form>
    <div class="auth-links"><a href="login.html">&larr; Back to sign in</a></div>
  </div>
</div>
<script src="api-config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  try {
    const data = await api('/auth/forgot-password', { method: 'POST', body: { email }, auth: false });
    msg.textContent = data.message;
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
