<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password | Autumn Gents Suites</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; margin-bottom:18px;"><span class="brand-mark">A</span> Autumn Gents Suites</div>
    <h2>Set a New Password</h2>
    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password (min. 8 characters)</label>
        <input type="password" id="newPassword" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>
    </form>
    <div class="auth-links"><a href="login.html">&larr; Back to sign in</a></div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const userId = params.get('uid');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  errorEl.textContent = '';
  const newPassword = document.getElementById('newPassword').value;

  if (!token || !userId) {
    errorEl.textContent = 'Invalid or missing reset link.';
    return;
  }

  try {
    const data = await api('/auth/reset-password', { method: 'POST', body: { userId, token, newPassword }, auth: false });
    successEl.textContent = data.message;
    setTimeout(() => (window.location.href = 'login.html'), 1800);
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
