<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Dashboard | Autumn Gents Suites</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="dash-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">A</span> Tech Panel</div>
    <button class="nav-item active" data-tab="photos">🖼️ Photos</button>
    <button class="nav-item" data-tab="rooms">🛏️ Rooms &amp; Pricing</button>
    <button class="nav-item" data-tab="rules">📋 Rules</button>
    <button class="nav-item" data-tab="updates">📢 Updates</button>
    <button class="nav-item" data-tab="tickets">🛠️ Maintenance Tickets</button>
    <button class="nav-item" data-tab="settings">⚙️ Site &amp; Interface</button>
    <button class="nav-item logout-btn" id="logoutBtn">🚪 Logout</button>
  </aside>

  <main class="dash-main">
    <div class="dash-header">
      <h1 id="pageTitle">Photos</h1>
      <span id="welcomeUser" style="color:var(--text-muted);"></span>
    </div>

    <section class="tab-panel active" id="tab-photos">
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-bottom:14px;">Upload Photo</h3>
        <form id="photoForm">
          <div class="form-row">
            <div class="form-group"><label>Photo File</label><input type="file" id="photoFile" accept="image/*" required /></div>
            <div class="form-group">
              <label>Category</label>
              <select id="photoCategory">
                <option value="gallery">Gallery</option><option value="room">Room</option><option value="banner">Banner</option><option value="history">History</option><option value="staff">Staff</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>Caption</label><input type="text" id="photoCaption" /></div>
          <button type="submit" class="btn btn-primary">Upload</button>
        </form>
      </div>
      <div class="gallery-grid" id="adminGallery"></div>
    </section>

    <section class="tab-panel" id="tab-rooms">
      <div class="grid grid-3" id="roomsGrid"></div>
    </section>

    <section class="tab-panel" id="tab-rules">
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-bottom:14px;">Add Rule</h3>
        <form id="ruleForm">
          <div class="form-group"><label>Title</label><input type="text" id="ruleTitle" required /></div>
          <div class="form-group"><label>Content</label><textarea id="ruleContent" rows="3" required></textarea></div>
          <button type="submit" class="btn btn-primary">Add Rule</button>
        </form>
      </div>
      <div id="rulesAdminList"></div>
    </section>

    <section class="tab-panel" id="tab-updates">
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-bottom:14px;">Post Update</h3>
        <form id="updateForm">
          <div class="form-group"><label>Title</label><input type="text" id="updateTitle" required /></div>
          <div class="form-group"><label>Content</label><textarea id="updateContent" rows="3" required></textarea></div>
          <button type="submit" class="btn btn-primary">Post</button>
        </form>
      </div>
      <div id="updatesAdminList"></div>
    </section>

    <section class="tab-panel" id="tab-tickets">
      <div style="overflow-x:auto;"><table id="ticketsTable"><thead><tr><th>Raised By</th><th>Title</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="tab-panel" id="tab-settings">
      <div class="card">
        <h3 style="margin-bottom:14px;">Interface Theme</h3>
        <form id="settingsForm">
          <div class="form-row">
            <div class="form-group"><label>Background Color</label><input type="color" id="s_theme_primary" /></div>
            <div class="form-group"><label>Accent Color</label><input type="color" id="s_theme_accent" /></div>
          </div>
          <h3 style="margin:20px 0 14px;">Site Description</h3>
          <div class="form-group"><label>Tagline</label><input type="text" id="s_tagline" /></div>
          <div class="form-group"><label>Description</label><textarea id="s_description" rows="3"></textarea></div>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
      </div>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard-tech.js"></script>
</body>
</html>
